<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Assist - Loading</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap">
    <link rel="stylesheet" href="loading.css">
</head>

<body>
    <div class="loading-screen" id="loadingScreen">
        <div class="bg-circles">
            <div class="circle-1"></div>
            <div class="circle-2"></div>
            <div class="circle-3"></div>
        </div>
        <div class="falling-icons" id="fallingIcons"></div>
        
        <div class="logo-container">
            <img src="logo.png" alt="Medical Assist Logo" class="logo">
            <h1 class="logo-text">Medical Assist</h1>
            <p class="tagline">Your trusted healthcare companion</p>
        </div>
        
        <div class="loading-container">
            <div class="loading-bar">
                <div class="progress"></div>
            </div>
            <div class="loading-text">Initializing system...</div>
        </div>
        
        <div class="footer">
            <span class="version">wiss.bk</span>
            <span class="copyright">© 2025 Medical Assist. All rights reserved.</span>
        </div>
    </div>
    <script src="loading.js"></script>
</body>
</html>
